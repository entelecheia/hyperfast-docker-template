name: release

on:
  push:
    branches: [main]
    paths:
      - "copier.yaml"
      - ".copier-template/**"
  workflow_dispatch:

# Releases are never cancelled; a later push waits.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Tag and GitHub release only (no commit), so a protected main branch does not block it.
      - uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          changelog: false
          build: false
