_subdirectory: .copier-template
_templates_suffix: .jinja
_answers_file: .copier-docker-config.yaml
# multiselect questions need 9.3
_min_copier_version: "9.3.0"

project_name:
  type: str
  help: Project name (used for the image name and the compose project name)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}
    lowercase letters, digits and dashes; start with a letter
    {% endif %}

project_description:
  type: str
  default: ""
  help: One-line description (image label and README)

owner:
  type: str
  help: GitHub user or organization that owns the repo and the image namespace
  validator: >-
    {% if not (owner | regex_search('^[a-z0-9][a-z0-9-]*$')) %}
    lowercase letters, digits and dashes
    {% endif %}

author:
  type: str
  default: "{{ owner }}"
  help: Copyright holder for the license

copyright_year:
  type: str
  default: "2026"
  help: Copyright year for the license

license:
  type: str
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - None

registry:
  type: str
  default: ghcr.io
  help: Container registry

kind:
  type: str
  default: workspace
  help: "workspace: SSH dev container; service: one long-running process"
  choices:
    - workspace
    - service

build:
  type: bool
  default: true
  when: "{{ kind == 'service' }}"
  help: Build the image from a Dockerfile (no = run a pinned upstream image)

upstream_image:
  type: str
  default: ""
  when: "{{ kind == 'service' and not build }}"
  help: Upstream image with a pinned tag or digest (e.g. vllm/vllm-openai:v0.11.0)
  validator: >-
    {% if kind == 'service' and not build and (not (upstream_image | regex_search('[:@]'))
    or upstream_image | regex_search(':latest$')) %}
    pin a version tag or digest; latest is not allowed
    {% endif %}

variants:
  type: str
  multiselect: true
  default: ["cuda12.8-ubuntu24.04"]
  when: "{{ kind == 'workspace' or build }}"
  help: Image variants to build (each is one base image)
  choices:
    - cpu-ubuntu24.04
    - cuda12.8-ubuntu24.04
    - cuda13.0-ubuntu24.04
  validator: "{% if (kind == 'workspace' or build) and not variants %}pick at least one variant{% endif %}"

gpu:
  type: bool
  default: true
  help: Attach NVIDIA GPUs (pinned by UUID at deploy time)

service_port:
  type: int
  default: 8000
  when: "{{ kind == 'service' }}"
  help: Port the service listens on inside the container

healthcheck_path:
  type: str
  default: /health
  when: "{{ kind == 'service' }}"
  help: HTTP path the healthcheck requests

container_user:
  type: str
  default: app
  when: "{{ kind == 'workspace' or build }}"
  help: Non-root user inside the image
  validator: >-
    {% if not (container_user | regex_search('^[a-z_][a-z0-9_-]*$')) %}
    a valid Linux user name
    {% endif %}

workspace_sudo:
  type: bool
  default: true
  when: "{{ kind == 'workspace' }}"
  help: Give the workspace user passwordless sudo inside the container
